[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent"
version = "0.1.0"
description = "Competitive intelligence analysis workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "feedparser>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "plotly>=5.24",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
insight = "insight_agent.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

